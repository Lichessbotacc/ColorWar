<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

b,.st{text-shadow:0 2px 0 #0008}

@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 18px #ffd75e}}
.stat{font-size:12px;text-align:center;opacity:.85;margin-top:12px}
.card{--cw:64px;position:relative;width:var(--cw);height:calc(var(--cw)*1.5);border-radius:calc(var(--cw)*.14);background:linear-gradient(160deg,var(--c1),var(--c2));border:2px solid var(--bd);box-shadow:0 3px 0 #0007,inset 0 0 12px #fff3;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;flex:none;cursor:pointer;transition:transform .12s}

.card .art{width:calc(var(--cw)*.84);height:calc(var(--cw)*.84);margin-top:calc(var(--cw)*.04);pointer-events:none;flex:none}

.card.locked{filter:grayscale(1) brightness(.55)}

.gold1{background:linear-gradient(#e8b92a,#a87a0a)!important}.gold2{background:linear-gradient(#cfd6e0,#8b95a5)!important}.gold3{background:linear-gradient(#d98a4a,#8f4f1f)!important}

#battle{background:#0b0826}

#bar{flex:none;padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(#1a1250,#0d0830);border-top:2px solid #000a}

#hand{display:flex;align-items:flex-end;gap:8px;justify-content:center}

#result h1{margin:0;font-size:40px;letter-spacing:2px;text-shadow:0 4px 0 #000a}
.win{color:#ffd75e}.lose{color:#ff7b7b}.draw{color:#cfe}

#vs .pl{display:flex;align-items:center;gap:20px;font-size:60px}#vs .vsx{font-size:44px;font-weight:900;color:#ffd75e}

.slotrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.slotrow .card{--cw:min(64px,16vw);justify-self:center}
.tag{display:inline-block;background:#0005;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:800;margin:2px}

<div id="app">
 <div id="menu" class="screen">
  <div id="top"></div>

   <button data-act="tab" data-t="battle" class="on"><span>⚔️</span>Kampf</button>

 </div>

 </div>

<script>
// ==ENGINE START==
const W=360,H=600,RY=300,BR=[90,270],BW=24,RH=14;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.floor(Math.random()*a.length)];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const sc=l=>Math.pow(1.07,l-1);
const CARD_LIST=[
{id:'squire',name:'Jungritter',role:'NAH',e:'🗡️',cost:3,rar:'c',type:'troop',hp:520,dmg:85,atk:1.1,spd:42,range:14,count:1,rad:9,starter:1,desc:'Schlägt mit dem Schwert ein einzelnes Bodenziel.'},

{id:'goblins',name:'Gobbo-Bande',role:'SCHWARM',e:'🍄',cost:3,rar:'c',type:'troop',hp:135,dmg:38,atk:0.8,spd:52,range:11,count:4,rad:6,starter:1,desc:'Vier schnelle Dolchkämpfer, stark gegen Einzelziele.'},
{id:'bones',name:'Klapperhaufen',role:'SCHWARM',e:'💀',cost:2,rar:'c',type:'troop',hp:62,dmg:30,atk:0.7,spd:56,range:10,count:4,rad:5,starter:1,desc:'Vier billige Skelette zum Ablenken.'},
{id:'boar',name:'Eberreiter',role:'TURMJAGD',e:'🐗',cost:4,rar:'r',type:'troop',hp:720,dmg:140,atk:1.2,spd:40,range:14,count:1,rad:10,bOnly:1,charge:1,desc:'Ignoriert Truppen, rennt zu Gebäuden. Nach Anlauf viel schneller.'},

{id:'wyvern',name:'Drachenwelpe',role:'LUFT',e:'🐲',cost:4,rar:'r',type:'troop',hp:680,dmg:96,atk:1.3,spd:36,range:62,count:1,rad:11,fly:1,splash:20,hitsAir:1,proj:'fire',desc:'Fliegt und spuckt Feuer auf mehrere Gegner.'},

const CARDS={};CARD_LIST.forEach(c=>{CARDS[c.id]=c;if(c.type!=='spell'){c.dps=c.dmg/c.atk;}});

function mkT(team,type,x,y,lv){const k=type==='k',s=sc(lv),hp=(k?2600:1500)*s;return{kind:'tower',team,type,x,y,rad:k?28:22,hp,maxhp:hp,dmg:(k?100:78)*s,atk:k?1:.8,range:k?125:118,cd:.5,active:!k,dead:false,flash:0,tgt:null};}
const pw=u=>u.hp/10+(u.dmg/u.atk)*1.2;

 attack(u,t){

 }
 updTower(t,dt){

 kill(e){

class Brain{
 constructor(b){this.pf=b;this.est=5;this.cd=rnd(2,5);this.lane=Math.random()<.5?0:1;this.cr=0;this.cro=0;}

   const allFly=L.u.every(u=>u.fly),anyFly=L.u.some(u=>u.fly),bonly=L.u.some(u=>u.bOnly),swarm=L.u.length>=3&&L.p/L.u.length<110;

   let best=null,bs=0;

   if(best){const y=me===0?clamp(lead.y+55,335,520):clamp(lead.y-55,80,265);m.play(me,best.i,clamp(lead.x+rnd(-8,8),20,340),y);return;}
  }

  if(!ch&&tanks.length&&fp[0]+fp[1]<60){const t=tanks.slice().sort((a,b)=>a.c.cost-b.c.cost)[Math.random()<.5?0:tanks.length-1];if(el>=Math.max(gate,t.c.cost)){ch=t;pos={x:lane?270:90,y:me===0?530:70};}}
  if(!ch){const tr=aff.filter(o=>o.c.type==='troop'&&!o.c.heal||(o.c.heal&&fp[0]+fp[1]>0));
   if(tr.length&&(el>=gate||el>=9.6)){ch=pick(tr);pos={x:lane?270:90,y:me===0?(ch.c.range>50?520:470):(ch.c.range>50?80:130)};}}
  if(!ch&&el>=9.6){const any=aff.filter(o=>o.c.type!=='spell').sort((a,b)=>a.c.cost-b.c.cost)[0];if(any){ch=any;pos=any.c.type==='building'?{x:180,y:me===0?395:205}:{x:lane?270:90,y:me===0?500:100};}}
  if(ch)m.play(me,ch.i,pos.x,pos.y);

const BOT_NAMES=['DrachenDirk','MiaMagie','Waffelbär','NachtEule','Turbo_Tom','KönigKlaus','FeuerFee','Kartoffel99','ZauberLisa','GolemGustav','Blitz_Ben','Bergtroll','Zuckerwatte','Schnitzel','LordLoki','Pfannkuchen','Mondfalke','KleinerRitter','TurmTitan','BogenBea','Rabauke','Sternschnuppe','EisKönigin','Moritz_M','PixelPaul','Elchjäger','SchlossGeist','OmaHatRecht'];
const AVATARS=['🦊','🐼','🐸','🦁','🐙','🦉','🐺','🐯','🐵','🦄','🐲','🐧','🦖','🐝','🦈','🐨','🦅','🐻','🐰','🐢','🦋','🐞','🦔','🐳','🐮','🦦','🦩','🐷'];
function mkDeck(){
 const tanks=['titan','boar','axe','guard'],air=['archer','moth','wyvern','mage','healer'],sp=['fireball','frost','volley','bolt'];
 for(;;){const d=new Set();d.add(pick(tanks));d.add(pick(air));d.add(pick(sp));if(Math.random()<.5)d.add(pick(sp));while(d.size<8)d.add(pick(CARD_LIST).id);
  const a=[...d],avg=a.reduce((s,i)=>s+CARDS[i].cost,0)/8,n=a.filter(i=>CARDS[i].type==='spell').length;
  if(avg>=2.9&&avg<=4.3&&n<=2&&a.some(i=>CARDS[i].hitsAir))return a;}
}
function mkBots(){return BOT_NAMES.map((n,i)=>({id:i,name:n,av:AVATARS[i%AVATARS.length],act:+(.08+Math.pow(Math.random(),1.4)*.92).toFixed(2),skill:+(.5+Math.random()*.48).toFixed(2),aggr:+(.15+Math.random()*.75).toFixed(2),lvl:1,trophies:0,wins:0,losses:0,draws:0,deck:mkDeck(),online:false,sessEnd:0,idle:rnd(2,20),inMatch:false,lastSeen:0,wait:0,form:[]}));}
function trophyDelta(w,l){return Math.round(clamp(26+clamp((l.trophies-w.trophies)/25,-8,12),14,40));}
function settle(A,B,w){
 let da=0,db=0;const f=(o,r)=>{o.form=o.form||[];o.form.unshift(r);if(o.form.length>5)o.form.length=5;};
 if(w===-1){A.draws=(A.draws||0)+1;B.draws=(B.draws||0)+1;f(A,'D');f(B,'D');}
 else{const Wn=w===0?A:B,Ls=w===0?B:A,d=trophyDelta(Wn,Ls),lo=Math.min(Ls.trophies,Math.round(d*.8));Wn.trophies+=d;Ls.trophies-=lo;Wn.wins=(Wn.wins||0)+1;Ls.losses=(Ls.losses||0)+1;
  if(w===0){da=d;db=-lo;}else{db=d;da=-lo;}f(Wn,'W');f(Ls,'L');}
 return{da,db};
}
function botProgress(b,won){if(won&&b.wins%5===0)b.lvl=Math.min(13,b.lvl+1);}
class World{
 constructor(bots){this.bots=bots;this.matches=[];this.recent=[];this.speed=8;this.id=1;for(const b of bots)if(Math.random()<.4+b.act*.3){b.online=true;b.sessEnd=rnd(60,400);b.idle=rnd(0,12);}}
 profile(b){return{name:b.name,av:b.av,trophies:b.trophies,deck:b.deck,kingLvl:b.lvl,lvl:()=>b.lvl,brain:new Brain(b),bot:b};}
 startMatch(a,b){a.inMatch=b.inMatch=true;const m=new Match(this.profile(a),this.profile(b));m.id=this.id++;m.speed=this.speed;m.watch=false;m.A=a;m.B=b;m.onEnd=()=>this.endMatch(m);this.matches.push(m);return m;}
 endMatch(m){
  const a=m.A,b=m.B,w=m.winner;settle(a,b,w);if(w>=0)botProgress(w===0?a:b,true);
  this.recent.unshift({a:a.name,b:b.name,av:a.av,bv:b.av,ca:m.crowns[0],cb:m.crowns[1],w});if(this.recent.length>10)this.recent.length=10;
  for(const x of[a,b]){x.inMatch=false;x.idle=rnd(4,14)/(.4+x.act);x.wait=0;}
 }
 pickOpponent(tr){
  let best=null,bs=1e9;for(const b of this.bots){if(b.inMatch)continue;const s=Math.abs(b.trophies-tr)-(b.online?60:0)+Math.random()*40;if(s<bs){bs=s;best=b;}}
  if(best){best.inMatch=true;best.online=true;best.sessEnd=Math.max(best.sessEnd,120);}return best;
 }
 update(dt){
  for(const b of this.bots){if(b.inMatch)continue;
   if(b.online){b.sessEnd-=dt;if(b.sessEnd<=0){b.online=false;b.lastSeen=Date.now();}else{b.idle-=dt;b.wait+=dt;}}
   else if(Math.random()<.0035*b.act*dt){b.online=true;b.sessEnd=rnd(90,420)*(.5+b.act);b.idle=rnd(1,6);b.wait=0;}}
  const q=this.bots.filter(b=>b.online&&!b.inMatch&&b.idle<=0).sort((x,y)=>x.trophies-y.trophies),used=new Set();
  for(const a of q){if(used.has(a.id))continue;let best=null,bd=1e9;
   for(const c of q){if(c===a||used.has(c.id))continue;const d=Math.abs(c.trophies-a.trophies);if(d<bd){bd=d;best=c;}}
   if(best&&bd<=120+Math.max(a.wait,best.wait)*6){used.add(a.id);used.add(best.id);this.startMatch(a,best);}}
  for(const m of this.matches.slice()){const h=m.watch?1/30:1/20;m.acc=(m.acc||0)+dt*m.speed;let n=0;
   while(m.acc>=h&&!m.over&&n<40){m.step(h);m.acc-=h;n++;}
   if(m.over){const i=this.matches.indexOf(m);if(i>=0)this.matches.splice(i,1);}}
 }
}

function cardHTML(id,lvl,cls=''){const c=CARDS[id];return`<div class="card r-${c.rar} ${cls}" data-id="${id}"><i class="cost">${c.cost}</i><img class="art" src="${pic(id)}" alt="" draggable="false"><span class="role" style="background:${ROLE_COL[c.role]}">${c.role}</span><div class="nm">${c.name}</div>${lvl?`<div class="lv">Lv ${lvl}</div>`:''}</div>`;}
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.id==='modal'&&e.target!==el)return;const f=ACT[el.dataset.act];if(f)f(el,e);});
function checkLevel(){while(S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;S.gold+=100*(S.lvl-1);toast('🎉 Level '+S.lvl+'! +'+100*(S.lvl-1)+' 🪙');sfx(800,.3,'triangle',.06,400);}}
function openChest(ch){
 const sv=ch.type==='silver',gold=Math.round(sv?rnd(90,150):rnd(40,80)),n=sv?3:2,out={};
 for(let i=0;i<n;i++){const w=CARD_LIST.map(c=>c.rar==='c'?60:c.rar==='r'?28:12),tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot,k=0;while(r>w[k]){r-=w[k];k++;}const c=CARD_LIST[k];out[c.id]=(out[c.id]||0)+Math.round((sv?rnd(3,6):rnd(2,4))*(c.rar==='c'?2:c.rar==='r'?1:.5))+1;}
 S.gold+=gold;const cards=Object.entries(out).map(([id,nn])=>{S.cards[id].copies+=nn;return{id,n:nn};});return{gold,cards};
}

  const[x,y]=V(u.x,u.y),n=u.c.name,w=ctx.measureText(n).width+8,lx=clamp(x,w/2+1,W-w/2-1);let ly=y-(u.fly?16:0)+u.rad*.75+u.rad*.55+8;
  for(let i=0;i<5&&boxes.some(b=>Math.abs(b.x-lx)<(b.w+w)/2&&Math.abs(b.y-ly)<11);i++)ly+=11;boxes.push({x:lx,y:ly,w});
  ctx.fillStyle=u.team===0?'rgba(30,64,175,.9)':'rgba(153,27,27,.9)';rr(lx-w/2,ly-5.5,w,11,4);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(n,lx,ly+.5);}
}
function drawUnit(u,m){
 const[x,y0]=V(u.x,u.y),r=u.rad,dp=u.dep>0?clamp(1-u.dep,0,1):1,col=u.team===0?'#3b82f6':'#ef4444',lift=u.fly?16:0;
 ctx.fillStyle='rgba(0,0,0,.27)';ctx.beginPath();ctx.ellipse(x,y0+r*.5,r*.9,r*.45,0,0,7);ctx.fill();
 let ox=0,oy=0;if(u.lunge>0&&u.tgt){const f=view.flip?-1:1,a=Math.atan2((u.tgt.y-u.y)*f,(u.tgt.x-u.x)*f);ox=Math.cos(a)*u.lunge*4;oy=Math.sin(a)*u.lunge*4;}
 const bob=u.spd>0&&u.dep<=0?Math.sin(m.t*11+u.id)*1.2:0,s=.5+.5*dp;
 ctx.save();ctx.globalAlpha=.5+.5*dp;ctx.translate(x+ox,y0-lift-(1-dp)*14+oy+bob);ctx.scale(s,s);
 ctx.globalAlpha*=1;ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.fillStyle=col+'55';ctx.beginPath();ctx.ellipse(0,r*.75,r+3,r*.55+1,0,0,7);ctx.fill();ctx.stroke();
 const k=figScale(r),face=u.tgt&&(u.tgt.x-u.x)*(view.flip?-1:1)<-6?-1:1;
 if(u.c.charge&&u.charge>2){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;for(let i=-1;i<2;i++){ctx.beginPath();ctx.moveTo(-face*(r+6),i*5);ctx.lineTo(-face*(r+15),i*5);ctx.stroke();}}
 ctx.save();ctx.translate(0,r*.75-17*k);ctx.scale(k*face,k);if(u.flash>0)ctx.filter='brightness(2)';drawFig(ctx,u.c.id,col,m.t+u.id);ctx.restore();
 if(u.slow>0){ctx.strokeStyle='#7fe0ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r+6,0,7);ctx.stroke();}
 if(u.stun>0){ctx.strokeStyle='#ffe44d';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r+6,0,7);ctx.stroke();}
 ctx.restore();
 if(u.hp<u.maxhp||u.building)hpBar(x,y0-lift+r*.75-36*figScale(r)-5,Math.max(16,r*2+6),u.hp/u.maxhp,col);
}
function fig(id,x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s/40,s/40);drawFig(ctx,id,'#3b82f6');ctx.restore();}
function drawProj(p){
 const[x,y]=V(p.x,p.y);const vx=view.flip?-p.vx:p.vx,vy=view.flip?-p.vy:p.vy;
 if(p.kind==='arrow'){ctx.strokeStyle=p.team===0?'#dbeafe':'#fee2e2';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-vx*9,y-vy*9);ctx.stroke();}
 else if(p.kind==='ball'){ctx.fillStyle='#222';ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();}
 else{const c=p.kind==='fire'?['#ffd27a','#ff6a1a']:['#f0c8ff','#a52de0'];const g=ctx.createRadialGradient(x,y,1,x,y,8);g.addColorStop(0,c[0]);g.addColorStop(1,c[1]+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,8,0,7);ctx.fill();ctx.fillStyle=c[0];ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill();}
}
function drawFx(f){
 const[x,y]=V(f.x,f.y);
 if(f.t==='spell'){const c=f.c;
  if(f.age<f.delay){const k=f.age/f.delay;ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.beginPath();ctx.arc(x,y,c.radius,0,7);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(255,255,255,.1)';ctx.fill();
   if(c.id==='fireball'){fig('fireball',x,y-(1-k)*190,36);}else if(c.id==='volley'){for(let i=0;i<7;i++){const ax=x+Math.sin(i*2.1)*c.radius*.7,ay=y+Math.cos(i*1.7)*c.radius*.6-(1-k)*120+i*4;ctx.strokeStyle='#eee';ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax+2,ay-8);ctx.stroke();}}}
  else{const k=(f.age-f.delay)/f.dur,a=1-k;
   if(c.strikes&&f.hits){ctx.strokeStyle=`rgba(255,240,120,${a})`;ctx.lineWidth=3;for(const h of f.hits){const[hx,hy]=V(h.x,h.y);ctx.beginPath();let px=hx+rnd(-10,10),py=hy-120;ctx.moveTo(px,py);for(let i=1;i<=6;i++){px=hx+rnd(-9,9)*(1-i/7);py=hy-120+i*20;ctx.lineTo(px,py);}ctx.stroke();ctx.fillStyle=`rgba(255,255,160,${a*.6})`;ctx.beginPath();ctx.arc(hx,hy,24*k+8,0,7);ctx.fill();}}
   else{ctx.fillStyle=c.id==='frost'?`rgba(140,220,255,${a*.5})`:c.id==='fireball'?`rgba(255,120,30,${a*.55})`:`rgba(255,255,255,${a*.35})`;ctx.beginPath();ctx.arc(x,y,c.radius*(.6+.4*k),0,7);ctx.fill();ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=3;ctx.stroke();if(c.id==='frost'){for(let i=0;i<5;i++)emoji('❄️',x+Math.cos(i*1.3)*c.radius*.6,y+Math.sin(i*1.3)*c.radius*.6-k*10,12);}}}
 }else if(f.t==='ring'){const k=f.age/f.dur;ctx.strokeStyle=f.col;ctx.globalAlpha=1-k;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,f.r*(.4+.6*k),0,7);ctx.stroke();ctx.globalAlpha=1;}
 else if(f.t==='poof'){const k=f.age/f.dur;ctx.fillStyle=`rgba(230,230,230,${(1-k)*.8})`;for(let i=0;i<5;i++){const a=i*1.26;ctx.beginPath();ctx.arc(x+Math.cos(a)*f.r*k*1.4,y+Math.sin(a)*f.r*k*1.1,f.r*.35*(1-k*.4),0,7);ctx.fill();}}
 else if(f.t==='boom'){const k=f.age/f.dur;for(let i=0;i<10;i++){const a=i*.63,d=f.r*k*1.2;ctx.fillStyle=`rgba(${i%2?255:90},${i%2?150:90},${i%2?40:90},${1-k})`;ctx.beginPath();ctx.arc(x+Math.cos(a)*d,y+Math.sin(a)*d*.8,10*(1-k)+3,0,7);ctx.fill();}ctx.fillStyle=`rgba(255,220,120,${(1-k)*.7})`;ctx.beginPath();ctx.arc(x,y,f.r*k,0,7);ctx.fill();}
 else if(f.t==='num'){const k=f.age/f.dur;ctx.globalAlpha=1-k*k;ctx.font='bold '+(f.tw?13:11)+'px sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.fillStyle=f.team===0?'#ffb4b4':'#fff3a0';const yy=y-k*22;ctx.strokeText(f.v,x,yy);ctx.fillText(f.v,x,yy);ctx.globalAlpha=1;}
}
function drawBattle(m){
 const c=cv.width/W;ctx.setTransform(c,0,0,c,0,0);ctx.clearRect(0,0,W,H);
 drawArena(view.theme,m.t);
 if(mode==='battle'&&view.sel>=0){const card=CARDS[m.hand[0][view.sel]];if(card&&card.type!=='spell'){for(let i=0;i<12;i++)for(let j=0;j<20;j++){const x=i*30+15,y=j*30+15;if(m.canPlace(0,x,y)){ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(i*30,j*30,30,30);}else if(y<RY){ctx.fillStyle='rgba(255,40,40,.14)';ctx.fillRect(i*30,j*30,30,30);}}}}
 const items=[];for(const t of m.towers)items.push({y:V(t.x,t.y)[1],f:()=>drawTower(t,m)});
 for(const u of m.units)if(!u.fly)items.push({y:V(u.x,u.y)[1],f:()=>drawUnit(u,m)});
 items.sort((a,b)=>a.y-b.y);items.forEach(i=>i.f());
 for(const u of m.units)if(u.fly)drawUnit(u,m);
 for(const p of m.projs)drawProj(p);
 for(const f of m.fx)drawFx(f);
 drawLabels(m);
 if(mode==='battle'&&view.sel>=0&&view.hover){const card=CARDS[m.hand[0][view.sel]];if(card){const[hx,hy]=view.hover;
  if(card.type==='spell'){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.arc(hx,hy,card.radius,0,7);ctx.fill();ctx.stroke();ctx.globalAlpha=.8;fig(card.id,hx,hy,32);ctx.globalAlpha=1;}
  else{const ok=m.canPlace(0,hx,hy);ctx.globalAlpha=ok?.75:.4;if(!ok){ctx.fillStyle='rgba(255,0,0,.35)';ctx.beginPath();ctx.arc(hx,hy,16,0,7);ctx.fill();}fig(card.id,hx,hy,figScale(card.rad)*40);if(card.range>40){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(hx,hy,card.range+card.rad,0,7);ctx.stroke();ctx.setLineDash([]);}ctx.globalAlpha=1;}}}
 if(m.emote){const k=m.tw[m.emote.team][2],[x,y]=V(k.x,k.y),yy=y-(m.emote.team===(view.flip?1:0)?68:-4);ctx.fillStyle='#fff';rr(x-22,yy-28,44,34,12);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.stroke();emoji(m.emote.e,x,yy-11,24);}
}
// HUD
function crownsHTML(n){return[0,1,2].map(i=>`<span class="${i<n?'on':'of'}">♛</span>`).join('');}
let lastHand='',lastBan=0;
function hud(m,watch){
 const top=watch&&view.flip?0:1,bot=1-top;
 $('#oppAv').textContent=m.p[top].av||'👤';$('#oppName').textContent=m.p[top].name+' 🏆'+(m.p[top].trophies|0);$('#oppCrowns').innerHTML=crownsHTML(m.crowns[bot]);
 $('#meAv').textContent=m.p[bot].av||'👤';$('#meName').textContent=m.p[bot].name+' 🏆'+(m.p[bot].trophies|0);$('#meCrowns').innerHTML=crownsHTML(m.crowns[top]);
 const tm=$('#timer');tm.textContent=m.ot?'⚡ '+fmt(240-m.t):fmt(180-m.t);tm.classList.toggle('dbl',m.t>=120);
 if(!watch){const el=m.el[0];$('#elixFill').style.width=el/10*100+'%';$('#elixNum').textContent=Math.floor(el);
  const h=m.hand[0].join(',')+'|'+m.hand[0].map(id=>CARDS[id].cost<=el?1:0).join('')+'|'+view.sel+'|'+m.queue[0][0];
  if(h!==lastHand){lastHand=h;$('#cards').innerHTML=m.hand[0].map((id,i)=>cardHTML(id,S.cards[id].lvl,(CARDS[id].cost>el?'no ':'')+(view.sel===i?'sel':'')).replace('class="card','data-i="'+i+'" class="card')).join('');$('#nextCard').innerHTML='Nächste'+cardHTML(m.queue[0][0],0);}}
 if(!watch){const c=view.sel>=0&&CARDS[m.hand[0][view.sel]];setHTML($('#info'),c?`<span><b>${c.name} · ${c.role}</b><br>${c.desc}</span>`:'<span>Tippe eine Karte an, um zu sehen, was sie tut.</span>','info');}
 $('#lblBtn').classList.toggle('off',S.labels===false);
 const b=$('#banner');if(m.t>=120&&m.t<122&&lastBan!==1){lastBan=1;b.textContent='DOPPELTES ELIXIER!';b.classList.remove('on');void b.offsetWidth;b.classList.add('on');}
 if(m.ot&&m.t<182&&lastBan!==2){lastBan=2;b.textContent='VERLÄNGERUNG!';b.classList.remove('on');void b.offsetWidth;b.classList.add('on');}
}
function evSound(m){for(const e of m.ev){if(e==='play0')SND.play0();else if(e==='tower')SND.tower();}m.ev.length=0;}

// ---- Kampf (Spieler)
function playerProfile(){return{name:S.name,av:'👑',trophies:S.trophies,deck:S.deck.slice(),kingLvl:S.lvl,lvl:id=>S.cards[id].lvl,brain:null};}
function showScreen(s){$('#menu').classList.toggle('hidden',s!=='menu');$('#battle').classList.toggle('hidden',s!=='battle');}
function startBattle(){
 const opp=world.pickOpponent(S.trophies);if(!opp){toast('Gerade kein Gegner frei – gleich nochmal');return;}
 popp=opp;const v=$('#vs');v.classList.remove('hidden');
 v.innerHTML=`<div class="stat" style="font-size:16px">Gegner gefunden!</div><div class="pl"><div class="p">👑<small>${S.name}</small><small>🏆 ${S.trophies}</small></div><div class="vsx">VS</div><div class="p">${opp.av}<small>${opp.name}</small><small>🏆 ${opp.trophies} · Lv ${opp.lvl}</small></div></div>`;
 sfx(300,.4,'sawtooth',.05,300);
 setTimeout(()=>{v.classList.add('hidden');beginMatch(opp);},2200);
}
function beginMatch(opp){
 pm=new Match(playerProfile(),world.profile(opp));pm.onEnd=()=>{pm.endAt=performance.now();};
 mode='battle';started=true;pacc=0;lastHand='';lastBan=0;view.sel=-1;view.hover=null;view.flip=false;view.theme=themeFor(Math.max(S.trophies,opp.trophies));
 showScreen('battle');$('#bar').classList.remove('hidden');$('#watchBar').classList.add('hidden');$('#emoBtn').classList.remove('hidden');fit();
 $('#emoPick').innerHTML=['😀','😎','😂','😭','😡','👍'].map(e=>`<span data-act="emo" data-e="${e}">${e}</span>`).join('');$('#emoPick').classList.add('hidden');
 const b=$('#banner');b.textContent='LOS!';b.classList.remove('on');void b.offsetWidth;b.classList.add('on');
}
function showResult(m){
 const w=m.winner,opp=popp,r=settle(S,opp,w);botProgress(opp,w===1);opp.inMatch=false;opp.idle=rnd(6,16);opp.wait=0;
 const cr=m.crowns;let gold,xp,chest=null;
 if(w===0){gold=25+12*cr[0];xp=35+10*cr[0];const f=S.chests.findIndex(c=>!c);if(f>=0){chest={type:Math.random()<.3?'silver':'wood'};S.chests[f]=chest;}}
 else if(w===1){gold=8+4*cr[0];xp=12+5*cr[0];}else{gold=12;xp=20;}
 S.gold+=gold;S.xp+=xp;checkLevel();save();
 (w===0?SND.win:SND.lose)();
 $('#result').innerHTML=`<div class="mbox"><h1 class="${w===0?'win':w===1?'lose':'draw'}">${w===0?'SIEG!':w===1?'NIEDERLAGE':'UNENTSCHIEDEN'}</h1>
 <div style="font-size:34px;margin:6px 0" class="crowns"><span style="color:#8cf">${crownsHTML(cr[1]).replace(/class="on"/g,'class="on"')}</span> &nbsp;:&nbsp; <span style="color:#f99">${crownsHTML(cr[0])}</span></div>
 <div style="font-size:13px;opacity:.9">${S.name} ${cr[0]} : ${cr[1]} ${opp.name}</div>
 <table style="margin:12px 0"><tr><td>Trophäen</td><td>${r.da>=0?'+':''}${r.da} 🏆</td></tr><tr><td>Gold</td><td>+${gold} 🪙</td></tr><tr><td>Erfahrung</td><td>+${xp} XP</td></tr>${chest?`<tr><td>Truhe</td><td>${chest.type==='silver'?'🧰 Silber':'📦 Holz'}</td></tr>`:''}</table>
 <button class="btn green big" style="width:100%;font-size:20px" data-act="resClose">Weiter</button></div>`;
 $('#result').classList.remove('hidden');
}
function leaveBattle(){mode='menu';pm=null;popp=null;showScreen('menu');lastHTML.tab='';renderTab();}
// Zuschauen
function startWatch(m){wm=m;m.watch=true;m.speed=1;mode='watch';view.flip=false;view.sel=-1;view.theme=themeFor(Math.max(m.A.trophies,m.B.trophies));lastBan=0;showScreen('battle');$('#bar').classList.add('hidden');$('#watchBar').classList.remove('hidden');$('#emoBtn').classList.add('hidden');$('#emoPick').classList.add('hidden');fit();updWatchBtns();}
function updWatchBtns(){document.querySelectorAll('#watchBar .sp').forEach(b=>b.classList.toggle('on',wm&&+b.dataset.s===wm.speed));}
function endWatch(){if(wm){wm.watch=false;wm.speed=world.speed;}wm=null;mode='menu';showScreen('menu');lastHTML.tab='';renderTab();}

// Eingabe
function cvPos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H,e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom];}
let drag=null;
$('#cards').addEventListener('pointerdown',e=>{const el=e.target.closest('[data-i]');if(!el||!pm||pm.over)return;e.preventDefault();const i=+el.dataset.i;drag={i,moved:false,sx:e.clientX,sy:e.clientY,was:view.sel===i};view.sel=i;lastHand='';});
window.addEventListener('pointermove',e=>{if(mode!=='battle')return;const[x,y,inn]=cvPos(e);view.hover=inn?[x,y]:view.hover;if(drag&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8)drag.moved=true;});
window.addEventListener('pointerup',e=>{
 if(mode!=='battle'||!pm){drag=null;return;}
 const[x,y,inn]=cvPos(e);const d=drag;drag=null;
 if(d&&!d.moved){if(d.was){view.sel=-1;lastHand='';}return;}
 if(inn&&view.sel>=0&&!pm.over){
  if(pm.play(0,view.sel,x,y)){view.sel=-1;lastHand='';}else{const c=CARDS[pm.hand[0][view.sel]];SND.bad();if(c&&pm.el[0]<c.cost)toast('Nicht genug Elixir');else if(c&&c.type!=='spell')toast('Hier kannst du nicht platzieren');}
 }
});
document.addEventListener('keydown',e=>{if(mode==='battle'&&pm&&e.key>='1'&&e.key<='4'){view.sel=+e.key-1;lastHand='';}});

// Hauptschleife
let last=performance.now(),mt=0;
function frame(now){
 const dt=Math.min(.1,(now-last)/1000);last=now;world.update(dt);
 if(mode==='battle'&&pm){
  if(!pm.over){pacc+=dt;let n=0;while(pacc>=1/30&&n<6){pm.step(1/30);pacc-=1/30;n++;}}
  evSound(pm);drawBattle(pm);hud(pm,false);
  if(pm.over&&!pm.shown&&performance.now()-pm.endAt>1600){pm.shown=true;showResult(pm);}
 }else if(mode==='watch'&&wm){
  drawBattle(wm);hud(wm,true);
  if(wm.over&&!wm.msg){wm.msg=1;const b=$('#banner');b.textContent=wm.winner<0?'REMIS':(wm.winner===0?wm.A.name:wm.B.name)+' gewinnt!';b.classList.remove('on');void b.offsetWidth;b.classList.add('on');}
 }else{mt+=dt;if(mt>=1){mt=0;if(!$('#modal').classList.contains('hidden')&&tab!=='live'){}else if($('#modal').classList.contains('hidden'))renderTab();}}
 requestAnimationFrame(frame);
}
renderTab();requestAnimationFrame(frame);
</script></body></html>
