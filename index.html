<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Crown battle</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#08051f;font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:#fff;overflow:hidden}
body{background:radial-gradient(1200px 700px at 50% -10%,#3a2a8c 0,#150f3d 55%,#08051f 100%)}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;background:linear-gradient(#2a1f70,#150e40);box-shadow:0 0 80px #000c}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.hidden{display:none!important}
b,.st{text-shadow:0 2px 0 #0008}
.btn{border:0;border-radius:14px;padding:10px 16px;font:900 15px inherit;font-family:inherit;color:#fff;cursor:pointer;background:linear-gradient(#ffd75e,#f2a01c);border-bottom:4px solid #a8620b;text-shadow:0 2px 0 #0006;box-shadow:0 4px 10px #0006}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.green{background:linear-gradient(#7be35a,#2fae26);border-bottom-color:#17701a}
.btn.red{background:linear-gradient(#ff7b6b,#d42f2f);border-bottom-color:#8a1414}
.btn.blue{background:linear-gradient(#6cc3ff,#2a74e0);border-bottom-color:#16409a}
.btn.big{font-size:26px;padding:16px;letter-spacing:2px}
.btn:disabled{filter:grayscale(1) brightness(.7);cursor:default}
#top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(#3b2d9a,#2a1f70);border-bottom:3px solid #12093a;flex:none}
#top .av{width:46px;height:46px;border-radius:12px;background:linear-gradient(#ffd75e,#e0891a);display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;border:2px solid #fff6}
#top .lvb{position:absolute;right:-6px;bottom:-6px;background:#2a74e0;border:2px solid #fff;border-radius:8px;font-size:11px;font-weight:900;padding:0 5px}
#top .nm{flex:1;min-width:0}
#top .xp{height:10px;background:#0006;border-radius:6px;overflow:hidden;margin-top:4px}
#top .xp i{display:block;height:100%;background:linear-gradient(#6cf,#27c)}
.pill{background:#0007;border-radius:20px;padding:4px 10px;font-weight:900;font-size:14px;white-space:nowrap;border:1px solid #fff2}
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;-webkit-overflow-scrolling:touch}
#nav{display:flex;flex:none;background:#12093a;border-top:3px solid #0a0524;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;border:0;color:#a9a0e0;padding:8px 0 6px;font:800 11px inherit;font-family:inherit;cursor:pointer}
#nav button span{display:block;font-size:22px;margin-bottom:1px}
#nav button.on{color:#fff;background:linear-gradient(#4a38b8,#2f2290);box-shadow:inset 0 3px 0 #ffd75e}
.arena{border-radius:18px;padding:18px;text-align:center;border:3px solid #fff5;box-shadow:0 6px 18px #0008,inset 0 0 40px #0004;margin-bottom:12px}
.arena .an{font-size:24px;font-weight:900;text-shadow:0 3px 0 #0008}
.arena .tr{font-size:34px;font-weight:900;margin:2px 0;text-shadow:0 3px 0 #0008}
.arena .sub{font-size:12px;opacity:.9;text-shadow:0 1px 0 #0008}
.sect{font-weight:900;font-size:15px;margin:14px 2px 8px;color:#ffd75e;text-shadow:0 2px 0 #0008}
.chests{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.chest{background:linear-gradient(#4b3aa8,#33267f);border:2px solid #7a68e0;border-radius:12px;height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:11px;font-weight:800;text-align:center}
.chest.empty{opacity:.4;border-style:dashed;cursor:default}
.chest .ci{font-size:32px;filter:drop-shadow(0 3px 2px #0007)}
.chest.ready{border-color:#ffd75e;animation:pulse 1s infinite;background:linear-gradient(#6a53d8,#4a38b8)}
@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 18px #ffd75e}}
.stat{font-size:12px;text-align:center;opacity:.85;margin-top:12px}
.card{--cw:64px;position:relative;width:var(--cw);height:calc(var(--cw)*1.5);border-radius:calc(var(--cw)*.14);background:linear-gradient(160deg,var(--c1),var(--c2));border:2px solid var(--bd);box-shadow:0 3px 0 #0007,inset 0 0 12px #fff3;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;flex:none;cursor:pointer;transition:transform .12s}
.r-c{--c1:#5aa9ff;--c2:#2a5fcf;--bd:#bcd9ff}.r-r{--c1:#ffb347;--c2:#d9731a;--bd:#ffe0a8}.r-e{--c1:#c97bff;--c2:#7d2fd0;--bd:#ecc9ff}.r-l{--c1:#5ff0d8;--c2:#c8458f;--bd:#fff3a0}
.card .art{width:calc(var(--cw)*.84);height:calc(var(--cw)*.84);margin-top:calc(var(--cw)*.04);pointer-events:none;flex:none}
.card .role{font-size:max(7px,calc(var(--cw)*.12));font-weight:900;line-height:1.35;padding:0 3px;border-radius:4px;border:1px solid #fff8;white-space:nowrap}
.card .nm{letter-spacing:-.3px;font-size:calc(var(--cw)*.128);font-weight:900;margin-top:2px;text-shadow:0 1px 2px #000a;text-align:center;line-height:1.05;white-space:nowrap}
.card .cost{position:absolute;left:-6px;top:-8px;width:calc(var(--cw)*.36);height:calc(var(--cw)*.36);border-radius:50% 50% 50% 10%;background:radial-gradient(circle at 35% 30%,#f0a6ff,#a21ad9);border:2px solid #fff;font-style:normal;font-weight:900;font-size:calc(var(--cw)*.22);display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);text-shadow:0 1px 1px #0008}
.card .lv{position:absolute;bottom:0;left:0;right:0;font-size:calc(var(--cw)*.13);background:#0008;text-align:center;border-radius:0 0 calc(var(--cw)*.12) calc(var(--cw)*.12);font-weight:800}
.card.locked{filter:grayscale(1) brightness(.55)}
.card.sel{outline:3px solid #ffd75e;transform:translateY(-4px)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;justify-items:center;padding:6px 4px}
.grid .card{--cw:min(72px,18vw)}
.minideck{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;justify-items:center;padding:6px 4px}
.minideck .card{--cw:min(64px,16vw)}
.row{display:flex;align-items:center;gap:10px;background:linear-gradient(#3b2d9a,#2d2182);border:2px solid #5a48c8;border-radius:14px;padding:8px 10px;margin-bottom:7px;cursor:pointer}
.row.me{background:linear-gradient(#a8780f,#7e5508);border-color:#ffd75e}
.row .rk{width:30px;text-align:center;font-weight:900;font-size:16px}
.row .ra{font-size:26px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:#0004;border-radius:10px}
.row .rn{flex:1;min-width:0;font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rs{font-size:11px;opacity:.85;font-weight:600}
.row .rt{font-weight:900;font-size:16px;white-space:nowrap}
.gold1{background:linear-gradient(#e8b92a,#a87a0a)!important}.gold2{background:linear-gradient(#cfd6e0,#8b95a5)!important}.gold3{background:linear-gradient(#d98a4a,#8f4f1f)!important}
.live{color:#ff6b6b;font-weight:900;animation:blink 1s infinite}@keyframes blink{50%{opacity:.35}}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4ade80;margin-right:4px}.dot.off{background:#777}
.mrow{background:linear-gradient(#3b2d9a,#2d2182);border:2px solid #5a48c8;border-radius:14px;padding:10px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.mrow .t{flex:1;text-align:center;font-weight:900;font-size:13px}
.mrow .sc{font-size:22px;font-weight:900}
.chip{display:inline-block;background:#0005;border-radius:8px;padding:1px 6px;font-size:10px;font-weight:800;margin-left:4px}
#modal,#result,#vs,#toast{position:absolute;z-index:50}
#modal{inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:linear-gradient(#3b2d9a,#251a70);border:3px solid #7a68e0;border-radius:20px;padding:16px;width:100%;max-width:420px;max-height:92%;overflow:auto;box-shadow:0 10px 40px #000}
.mbox h2{margin:0 0 8px;text-align:center;font-size:20px}
.mbox table{width:100%;font-size:13px;border-collapse:collapse}
.mbox td{padding:4px 2px;border-bottom:1px solid #fff2}.mbox td:last-child{text-align:right;font-weight:800}
.bar{height:16px;background:#0007;border-radius:9px;overflow:hidden;position:relative;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(#5ef,#18c)}.bar span{position:absolute;inset:0;text-align:center;font-size:11px;font-weight:900;line-height:16px}
#toast{top:14px;left:50%;transform:translateX(-50%);background:#000c;border:2px solid #ffd75e;padding:8px 16px;border-radius:20px;font-weight:900;font-size:14px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
#toast.on{opacity:1}
#battle{background:#0b0826}
#hud{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:linear-gradient(#2c2080,#1a1250);border-bottom:2px solid #000a;height:50px}
#hud .side{display:flex;align-items:center;gap:6px;min-width:0;flex:1}.side.r{justify-content:flex-end}
#hud .sav{font-size:22px}#hud .sn{font-weight:900;font-size:12px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crowns{font-size:18px;letter-spacing:1px}.crowns .on{color:#ffd75e;text-shadow:0 0 6px #ffb300}.crowns .of{color:#ffffff30}
#timer{font-weight:900;font-size:20px;padding:2px 12px;background:#0008;border-radius:12px;min-width:84px;text-align:center}
#timer.dbl{color:#e58bff;box-shadow:0 0 12px #c33cff}
#stage{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;background:#0b0826;overflow:hidden}
#cv{position:absolute;left:50%;top:0;transform:translateX(-50%);border-radius:10px;touch-action:none;box-shadow:0 0 30px #000}
#banner{position:absolute;top:35%;left:0;right:0;text-align:center;font-size:30px;font-weight:900;pointer-events:none;opacity:0;text-shadow:0 3px 0 #000,0 0 18px #c33cff}
#banner.on{animation:ban 2.2s}@keyframes ban{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
#bar{flex:none;padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(#1a1250,#0d0830);border-top:2px solid #000a}
#elixWrap{position:relative;height:22px;background:#2a0c40;border-radius:12px;border:2px solid #000;overflow:hidden;margin:0 2px 6px}
#elixFill{height:100%;width:50%;background:linear-gradient(#ee6cff,#a21ad9);transition:width .1s linear;box-shadow:inset 0 3px 0 #fff5}
#elixWrap .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#0006 calc(10% - 2px) 10%)}
#elixNum{position:absolute;left:8px;top:0;font-weight:900;line-height:19px;font-size:15px}
#info{height:32px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;line-height:1.25;margin:0 4px 5px;overflow:hidden}
#info b{color:#ffd75e}
#lblBtn{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;font-size:20px;padding:0}
#lblBtn.off{filter:grayscale(1) brightness(.7)}
#hand{display:flex;align-items:flex-end;gap:8px;justify-content:center}
#nextCard{display:flex;flex-direction:column;align-items:center;font-size:9px;font-weight:800;opacity:.9}
.wp{flex:none;padding:3px 8px;background:#1a1250}.wcards{display:flex;gap:9px;justify-content:center;align-items:flex-end;padding-top:6px}.wp .card{--cw:36px;cursor:default}.wp .role,.wp .nm{display:none}.wp .art{margin-top:6px}.wnext{font-size:8px;font-weight:800;text-align:center;margin-left:8px;opacity:.7}.wnext .card{--cw:30px}
.welix{position:relative;height:13px;background:#2a0c40;border-radius:8px;overflow:hidden;margin-top:3px}.welix i{display:block;height:100%;background:linear-gradient(#ee6cff,#a21ad9)}.welix span{position:absolute;left:8px;top:0;font-size:10px;line-height:13px;font-weight:900}
#nextCard .card{--cw:min(42px,11vw)}
#nextCard .role,#nextCard .nm{display:none}
#nextCard .art{margin-top:9px}
#cards{display:flex;gap:8px;touch-action:none}
#cards .card{--cw:min(66px,17.5vw)}
#cards .card.no{filter:grayscale(.8) brightness(.65)}
#watchBar{flex:none;display:flex;gap:8px;padding:8px;background:linear-gradient(#1a1250,#0d0830);align-items:center;justify-content:center;flex-wrap:wrap}
#watchBar .btn{padding:8px 12px;font-size:14px}
#watchBar .btn.on{box-shadow:0 0 0 3px #fff}
#emoBtn{position:absolute;left:8px;bottom:8px;width:44px;height:44px;border-radius:50%;font-size:24px;padding:0}
#emoPick{position:absolute;left:8px;bottom:58px;display:flex;gap:6px;background:#000b;padding:6px;border-radius:14px}
#emoPick span{font-size:28px;cursor:pointer;padding:2px 4px}
#result{inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px}
#result .mbox{text-align:center}
#result h1{margin:0;font-size:40px;letter-spacing:2px;text-shadow:0 4px 0 #000a}
.win{color:#ffd75e}.lose{color:#ff7b7b}.draw{color:#cfe}
#vs{inset:0;background:radial-gradient(circle,#3a2a8c,#0a0524);display:flex;align-items:center;justify-content:center;gap:12px;flex-direction:column}
#vs .pl{display:flex;align-items:center;gap:20px;font-size:60px}#vs .vsx{font-size:44px;font-weight:900;color:#ffd75e}
#vs .p{text-align:center}#vs .p small{display:block;font-size:14px;font-weight:900}
.slotrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.slotrow .card{--cw:min(64px,16vw);justify-self:center}
.tag{display:inline-block;background:#0005;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:800;margin:2px}
#battle{position:absolute}#hud{position:absolute;top:0;left:0;right:0;z-index:5;background:linear-gradient(#2c2080cc,#1a125000);border-bottom:0}#wTop:not(.hidden){margin-top:50px}#info{display:none}#elixWrap{height:16px;margin:0 2px 4px}#elixNum{line-height:13px;font-size:12px}#bar{padding:4px 8px calc(4px + env(safe-area-inset-bottom))}#cards .card{--cw:min(60px,15.5vw)}#nextCard .card{--cw:min(38px,10vw)}
#bar{position:absolute;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(#0d083000,#0d0830b0 60%);border-top:0;pointer-events:none}#bar #cards,#bar #nextCard{pointer-events:auto}#elixWrap{opacity:.9}
</style></head><body>
<div id="app">
 <div id="menu" class="screen">
  <div id="top"></div>
  <div id="content"></div>
  <div id="nav">
   <button data-act="tab" data-t="battle" class="on"><span>⚔️</span>Battle</button>
   <button data-act="tab" data-t="cards"><span>🃏</span>Cards</button>
   <button data-act="tab" data-t="rank"><span>🏆</span>Leaderboard</button>
   <button data-act="tab" data-t="live"><span>📺</span>Live</button>
  </div>
 </div>
 <div id="battle" class="screen hidden">
  <div id="hud">
   <div class="side"><span class="sav" id="oppAv"></span><div><div class="sn" id="oppName"></div><div class="crowns" id="oppCrowns"></div></div></div>
   <div id="timer">3:00</div>
   <div class="side r"><div style="text-align:right"><div class="sn" id="meName"></div><div class="crowns" id="meCrowns"></div></div><span class="sav" id="meAv"></span></div>
  </div>
  <div id="wTop" class="wp hidden"></div>
  <div id="stage"><canvas id="cv"></canvas><div id="banner"></div>
   <button class="btn" id="emoBtn" data-act="emoToggle">😀</button><div id="emoPick" class="hidden"></div><button class="btn blue" id="lblBtn" data-act="labels" title="Names on/off">🏷️</button></div>
  <div id="wBot" class="wp hidden"></div>
  <div id="bar">
   <div id="info"></div>
   <div id="elixWrap"><div id="elixFill"></div><div class="ticks"></div><span id="elixNum">5</span></div>

  </div>

   <button class="btn red" data-act="back">⟵ Back</button>
   <button class="btn blue sp" data-act="speed" data-s="1">1×</button><button class="btn blue sp" data-act="speed" data-s="2">2×</button><button class="btn blue sp" data-act="speed" data-s="4">4×</button>
   <button class="btn" data-act="flip">🔄 View</button>
  </div>
 </div>
 <div id="vs" class="hidden"></div>

<script>
// ==ENGINE START==
const W=360,H=600,RY=300,BR=[90,270],BW=24,RH=14;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.floor(Math.random()*a.length)];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const sc=l=>Math.pow(1.1,l-1);
// ---- Cards (Werte angelehnt an Clash Royale 2017, auf dieses Spiel skaliert)
const SPD={0:0,s:15,m:20,f:30,v:40}; // 1 Feld = 20 px; Slow/Medium/Fast/Very fast = 45/60/90/120
const RAR={c:{n:'Common',max:13},r:{n:'Rare',max:11},e:{n:'Epic',max:8},l:{n:'Legendary',max:5}};
const CARD_LIST=[],CARDS={};
function T(id,name,role,cost,rar,ar,hp,dmg,hs,spd,rng,desc,o={}){add(Object.assign({id,name,role,cost,rar,ar,type:'troop',hp,dmg,atk:hs,spd,rng,desc,count:1,rad:9},o));}
function Bd(id,name,role,cost,rar,ar,hp,dmg,hs,rng,life,desc,o={}){add(Object.assign({id,name,role,cost,rar,ar,type:'building',hp,dmg,atk:hs,spd:0,rng,life,desc,count:1,rad:13},o));}
function Sp(id,name,cost,rar,ar,dmg,r,desc,o={}){add(Object.assign({id,name,role:'SPELL',cost,rar,ar,type:'spell',dmg,r,desc},o));}
function add(c){
 const K=.6;c.hp=Math.round((c.hp||0)*K);c.dmg=Math.round((c.dmg||0)*K);
 if(c.shield)c.shield=Math.round(c.shield*K);if(c.heal)c.heal=Math.round(c.heal*K);if(c.death)c.death=[Math.round(c.death[0]*K),c.death[1]*20];if(c.land)c.land=[Math.round(c.land[0]*K),c.land[1]*20,c.land[2]||0];
 if(c.type==='spell')c.radius=c.r*20;else{c.spd=SPD[c.spd];c.range=Math.max(8,c.rng*20);if(c.rng>=2)c.proj=c.proj||'arrow';c.splash=(c.splash||0)*20;c.minR=(c.minR||0)*20;c.dps=c.atk?c.dmg/c.atk:0;}
 CARD_LIST.push(c);CARDS[c.id]=c;
}
// Arena 0 – Start
T('squire','Young Knight','MELEE',3,'c',0,1452,167,1.2,'m',.7,'Solid swordsman against ground targets.',{starter:1});
T('archer','Archer Duo','RANGED',3,'c',0,252,86,1.2,'m',5,'Two markswomen, hit ground and air.',{count:2,rad:7,hitsAir:1,starter:1});
T('moth','Flutter Beasts','AIR',3,'c',0,190,84,1,'f',1,'Three fliers, attack ground and air.',{count:3,rad:6,fly:1,hitsAir:1,starter:1});
T('titan','Stone Giant','TANK',5,'r',0,3275,211,1.5,'s',.8,'Only attacks buildings and withstands a ton of damage.',{rad:15,bOnly:1,starter:1});
T('minik','Tin Tot','MELEE',4,'r',0,1129,598,1.8,'f',.7,'Few but mighty blows.',{starter:1});
T('musk','Musket Maid','RANGED',4,'r',0,598,181,1.1,'m',6,'Long shots at ground and air.',{hitsAir:1,proj:'ball',starter:1});
Sp('volley','Arrow Hail',3,'c',0,243,4,'Large radius, ideal against swarms.',{starter:1});
Sp('fireball','Fireball',4,'r',0,572,2.5,'Lots of damage in a medium radius.',{starter:1});
// Arena 1
T('goblins','Goblin Gang','SWARM',2,'c',1,167,99,1.1,'v',.5,'Three very fast dagger fighters.',{count:3,rad:6});
T('speargob','Spear Goblins','RANGED',2,'c',1,110,67,1.3,'v',5,'Three nimble spear throwers, also against air.',{count:3,rad:6,hitsAir:1});
Bd('gobhut','Goblin Hut','SPAWNER',5,'r',1,1060,0,0,0,40,'Regularly sends out Spear Goblins.',{spawner:['speargob',1,4.9]});

function canUp(a,id){const d=a.cards[id];return d.own&&d.lvl<RAR[CARDS[id].rar].max&&d.copies>=need(id,d.lvl)&&a.gold>=goldNeed(id,d.lvl);}

function cardHTML(id,lvl,cls=''){const c=CARDS[id];return`<div class="card r-${c.rar} ${cls}" data-id="${id}"><i class="cost">${c.cost}</i><img class="art" src="${pic(id)}" alt="" draggable="false"><span class="role" style="background:${ROLE_COL[c.role]}">${c.role}</span><div class="nm">${c.name}</div>${lvl?`<div class="lv">Lv ${lvl}</div>`:''}</div>`;}
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};

(function(){

const prevDeck=botDeck;

 if(!x.out){x.tr=[];x.out=[];x.trN=0;x.tw=0;x.base=.5;x.cd=Math.floor(Math.random()*4);}

}
const good=b=>Array.isArray(b.deck)&&b.deck.length===8&&new Set(b.deck).size===8&&b.deck.every(id=>b.cards[id]&&b.cards[id].own);

// Das Deck bleibt, wie es ist. Nur ein unvollständiges Deck wird neu aufgebaut.

(function(){
const MAXM=20,KICK_AFTER=240000;
S.clans=Array.isArray(S.clans)?S.clans:[];S.cn=S.cn||1;
const CN=['Dragon Watch','Tower Titans','Crown Hunters','Elixir Junkies','Kingmaker','Pancake Pack','Night Wolves','Lightning Gang','Ice Guard','Golden Guild','Fire Falcons','Castle Guards','Goblin Gang','Wall Breakers'];
const BD=['🛡️','⚔️','🐉','🔥','❄️','⚡','🦅','🐺','👑','💎','🌙','☠️'];
const bk=b=>'b:'+b.name,botOf=k=>world.bots.find(b=>bk(b)===k);
const byId=id=>S.clans.find(c=>c.id===id),clanOf=k=>S.clans.find(c=>c.mem.some(m=>m.k===k));
const info=k=>{if(k==='me')return{name:S.name,av:'👑',tr:S.trophies,on:true,me:1};const b=botOf(k);return b?{name:b.name,av:b.av,tr:b.trophies,on:b.online}:null;};
const total=c=>c.mem.reduce((s,m)=>s+((info(m.k)||{}).tr||0),0);
function mk(k,name,badge,req){const c={id:S.cn++,name,badge,req,lead:k,mem:[{k,t:Date.now()}],ban:[],cr:[]};S.clans.push(c);return c;}
function drop(c,k){c.mem=c.mem.filter(m=>m.k!==k);c.cr=(c.cr||[]).filter(r=>r.k!==k);if(!c.mem.length){S.clans.splice(S.clans.indexOf(c),1);return;}
 if(c.lead===k)c.lead=c.mem.slice().sort((a,b)=>info(b.k).tr-info(a.k).tr)[0].k;}
function kick(c,k){drop(c,k);if(!c.ban.includes(k))c.ban.push(k);if(k==='me')toast('🥾 You were kicked from „'+c.name+'” kicked');}
function tick(){
 const now=Date.now(),names=new Set(world.bots.map(bk));
 for(const c of S.clans.slice()){c.mem=c.mem.filter(m=>m.k==='me'||names.has(m.k));
  if(!c.mem.length){S.clans.splice(S.clans.indexOf(c),1);continue;}
  if(!c.mem.some(m=>m.k===c.lead))c.lead=c.mem.slice().sort((a,b)=>info(b.k).tr-info(a.k).tr)[0].k;}
 for(const b of world.bots){const k=bk(b);if(!b.online||b.inMatch||clanOf(k))continue;
  if(Math.random()>.012+.03*b.act)continue;
  if(b.cc==null)b.cc=.05+Math.random()*.05; // 5–10 % gründen selbst einen Clan
  if(Math.random()<b.cc){const used=new Set(S.clans.map(c=>c.name.toLowerCase()));let n=pick(CN),i=2;while(used.has(n.toLowerCase()))n=pick(CN)+' '+(i++);
   mk(k,n,pick(BD),Math.floor(b.trophies*.4/100)*100);}
  else{const el=S.clans.filter(c=>c.mem.length<MAXM&&c.req<=b.trophies&&!c.ban.includes(k));if(el.length)pick(el).mem.push({k,t:now});}}
 // Bot-Anführer werfen nach einer Weile schwache Members raus
 for(const c of S.clans.slice()){if(c.lead==='me'||c.mem.length<4||Math.random()>.04)continue;
  const avg=total(c)/c.mem.length;
  const w=c.mem.filter(m=>m.k!==c.lead&&now-m.t>=KICK_AFTER&&info(m.k).tr<avg*.5).sort((a,b)=>info(a.k).tr-info(b.k).tr)[0];
  if(w)kick(c,w.k);}
 try{botCards(now);}catch(e){}
}
setInterval(tick,3000);setTimeout(tick,1000);
const membersHTML=(c,canKick)=>c.mem.map(m=>({m,i:info(m.k)})).sort((a,b)=>b.i.tr-a.i.tr).map(({m,i},n)=>`<div class="row ${i.me?'me':''}" style="cursor:default"><div class="rk">${n+1}</div><div class="ra">${i.av}</div><div style="flex:1;min-width:0"><div class="rn">${m.k===c.lead?'👑 ':''}${i.name}</div><span class="rs">${i.on?'<span class="dot"></span>online':'<span class="dot off"></span>offline'}</span></div><div class="rt">🏆 ${i.tr}</div>${!i.me&&i.on&&clanOf('me')===c?`<button class="btn blue mini" data-act="clanFriend" data-k="${m.k}">⚔️</button>`:''}${canKick&&m.k!==c.lead?`<button class="btn red mini" data-act="clanKick" data-c="${c.id}" data-k="${m.k}">🥾</button>`:''}</div>`).join('');
const head=c=>`<div class="arena" style="background:linear-gradient(#5a48c8,#2a1f70)"><div style="font-size:46px">${c.badge}</div><div class="an">${c.name}</div><div class="sub">${c.mem.length}/${MAXM} Members · 🏆 ${total(c)} · Join from ${c.req} 🏆</div></div>`;
// --- Cards anfordern & spenden ---
const RC={c:{cap:30,per:10,g:2,xp:1},r:{cap:9,per:3,g:10,xp:2},e:{cap:2,per:1,g:60,xp:4}},CD=120000,EXP=1200000;
const acc=k=>k==='me'?S:botOf(k);
function donate(r,dk){const rc=RC[CARDS[r.id].rar],a=acc(dk),t=acc(r.k);if(!rc||!a||!t||!a.cards[r.id]||!a.cards[r.id].own||!t.cards[r.id])return 0;
 const n=Math.min(rc.per,r.cap-r.got);if(n<=0||r.don[dk])return 0;r.got+=n;r.don[dk]=n;if(r.got>=r.cap)r.fin=Date.now();
 a.gold+=n*rc.g;addXp(a,n*rc.xp);t.cards[r.id].copies+=n;
 if(r.k==='me'&&dk!=='me'){const i=info(dk);toast('🃏 '+(i?i.name:'Clan member')+' donated '+n+'× '+CARDS[r.id].name);}return n;}
function botCards(now){let ch=false;
 for(const c of S.clans){c.cr=(c.cr||[]).filter(r=>now-r.t<EXP&&!(r.fin&&now-r.fin>60000));
  for(const m of c.mem){const b=botOf(m.k);if(!b||!b.online||b.inMatch)continue;
   if(!c.cr.some(r=>r.k===m.k)&&now>(b.reqAt||0)&&Math.random()<.06){
    const cs=PLAY_CARDS.filter(x=>x.rar!=='l'&&b.cards[x.id]&&b.cards[x.id].own&&b.cards[x.id].lvl<RAR[x.rar].max);
    cs.sort((x,y)=>((b.deck.includes(y.id)?1:0)-(b.deck.includes(x.id)?1:0))||((need(y.id,b.cards[y.id].lvl)-b.cards[y.id].copies)-(need(x.id,b.cards[x.id].lvl)-b.cards[x.id].copies)));
    const pk=cs.filter(x=>need(x.id,b.cards[x.id].lvl)>b.cards[x.id].copies)[0];
    b.reqAt=now+CD*(2+Math.random()*4);
    if(pk){c.cr.push({k:m.k,id:pk.id,cap:RC[pk.rar].cap,got:0,don:{},t:now});ch=true;}}}
  for(const r of c.cr){if(r.got>=r.cap)continue;
   for(const m of c.mem){if(m.k===r.k||r.don[m.k]||r.got>=r.cap)continue;const b=botOf(m.k);if(!b||!b.online||Math.random()>.07)continue;
    if(donate(r,m.k))ch=true;}}}
 if(ch){save();if(tab==='clan'&&$('#modal').classList.contains('hidden'))renderTab();}}
function cardsHTML(c){const now=Date.now(),mine=(c.cr||[]).some(r=>r.k==='me');
 let h='<div class="sect">🃏 Card requests</div>';
 if(!mine)h+=now<(S.reqAt||0)?`<div class="stat">Next request in ${Math.ceil((S.reqAt-now)/1000)} s</div>`:'<button class="btn blue" style="width:100%" data-act="clanReqAsk">🃏 Request cards</button>';
 h+=(c.cr||[]).slice().sort((a,b)=>(a.got>=a.cap)-(b.got>=b.cap)||b.t-a.t).map(r=>{const cd=CARDS[r.id],i=info(r.k)||{name:'?',av:'👤'},full=r.got>=r.cap,have=S.cards[r.id]&&S.cards[r.id].own;
  const can=r.k!=='me'&&!full&&!r.don.me&&have;
  return`<div class="row" style="cursor:default"><div style="flex:none;width:44px;height:44px"><img src="${pic(r.id)}" alt="" style="width:44px;height:44px;object-fit:contain"></div><div style="flex:1;min-width:0"><div class="rn">${cd.name}</div><span class="rs">${i.av} ${r.k==='me'?'Du':i.name} · ${r.got}/${r.cap}</span></div>${can?`<button class="btn green mini" data-act="clanDon" data-k="${r.k}">Donate</button>`:full?'<span class="rs">✅ full</span>':r.don.me?'<span class="rs">gespendet</span>':''}</div>`;}).join('')||'<div class="stat">No requests – request cards!</div>';
 return h;}
function clanTab(){

 if(my)h+=head(my)+cardsHTML(my)+`<div class="sect">Members${my.lead==='me'?' <span class="chip">🥾 = kick</span>':''}</div>`+membersHTML(my,my.lead==='me')+`<button class="btn red" style="width:100%;margin-top:10px" data-act="clanLeaveAsk">🚪 Leave clan</button>`;

 return h;
}

 clanNew(){if(clanOf('me'))return;showModal(`<h2>Create clan</h2><div style="display:flex;flex-direction:column;gap:8px"><input id="clName" maxlength="16" placeholder="Clan name (3–16 characters)" style="padding:10px;border-radius:10px;border:0;font:800 15px inherit"><input id="clReq" type="number" min="0" max="9999" value="0" placeholder="Min. trophies" style="padding:10px;border-radius:10px;border:0;font:800 15px inherit"><select id="clBadge" style="padding:10px;border-radius:10px;border:0;font:800 18px inherit">${BD.map(b=>`<option>${b}</option>`).join('')}</select><button class="btn green" data-act="clanCreate">Create</button><button class="btn" data-act="clanClose">Cancel</button></div>`);},

const rr=(b,k)=>{const x=Math.sin(((b.id|0)+1)*127.1+k*311.7+(b.name?b.name.length*7.3:0))*43758.5453;return x-Math.floor(x);};
function persona(br,b){
 const raw=clamp(b.skill==null?.5:b.skill,.1,1),s0=(raw-.1)/.9;
 // Stärke: sehr breite Spanne, schwächste ~0.02, stärkste 1.0
 const e=clamp(.02+Math.pow(s0,1.35)*.98+(rr(b,1)-.5)*.06,.02,1);
 br.pf=Object.assign({},br.pf,{skill:e});br._eff=e;
 br._mult=.5+Math.pow(1-e,1.15)*3.6;           // Reaktionszeit: stark ~0.5x, schwach ~4x langsamer
 br._err=Math.pow(1-e,1.4)*.8;                  // Platzierungsfehler
 br._junk=Math.pow(1-e,2)*.06;                  // planloses Spielen
 br._hoard=0;
 // Play style: jede Zahl im Stil pro Bot individuell skalieren
 const st=Object.assign({},br.st);let k=2;for(const key in st)if(typeof st[key]==='number')st[key]*=.55+.95*rr(b,k++);st.bridge=Math.max(0,st.bridge+(rr(b,60)-.3)*.25);st.split=clamp(st.split+(rr(b,61)-.5)*.3,0,.8);br.st=st;
 const base={cycle:2+rr(b,40)*1.5,beatdown:5+rr(b,41)*3,siege:4+rr(b,42)*2.5,bridge:3+rr(b,43)*2.5,control:3.5+rr(b,44)*3,balanced:3+rr(b,45)*3}[br.arch]||3;
 br._hoard=base*(.35+.65*e);
 br.lane=rr(b,50)<.5?0:1;
 br._pers=1;
 const t0=br.tick;
 br.tick=function(m,me,dt){const pre=this.cd-dt;t0.call(this,m,me,dt);if(pre<=0&&this.cd>0)this.cd*=this._mult;};
 const th=br.think;
 br.think=function(m,me){
  const el=m.el[me];
  if(el<this._hoard&&el<9&&Math.random()<.7)return;
  const lead=m.crowns[me]-m.crowns[1-me];
  if(Math.random()<this._junk&&el>=3){const a=m.hand[me].map((id,i)=>({id,i,c:CARDS[id]})).filter(o=>o.c.cost<=el&&o.c.type!=='spell');
   if(a.length){const o=pick(a);m.play(me,o.i,rnd(30,330),me===0?rnd(360,560):rnd(40,240));return;}}
  const err=this._err*(1+.3*Math.max(0,-lead)*(1-this._eff));
  if(err<.01)return th.call(this,m,me);
  const orig=m.play;
  m.play=function(t,hi,x,y){if(t===me&&Math.random()<err){x=clamp(x+rnd(-1,1)*110*err,10,350);y=y+rnd(-1,1)*90*err;
    if(Math.random()<err*.35){const af=this.hand[me].map((id,i)=>i).filter(i=>CARDS[this.hand[me][i]].cost<=this.el[me]);if(af.length)hi=pick(af);}}
   return orig.call(this,t,hi,x,y);};
  try{return th.call(this,m,me);}finally{delete m.play;}
 };
}
const pfp=World.prototype.profile;
World.prototype.profile=function(b){
 const p=pfp.call(this,b);
 try{if(b&&!b.stu&&p&&p.brain&&!p.brain._pers)persona(p.brain,b);}catch(e){}
 return p;
};
})();
