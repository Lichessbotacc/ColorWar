<style>

#battle{background:#0b0826}

#bar{flex:none;padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(#1a1250,#0d0830);border-top:2px solid #000a}

#hand{display:flex;align-items:flex-end;gap:8px;justify-content:center}
#nextCard{display:flex;flex-direction:column;align-items:center;font-size:9px;font-weight:800;opacity:.9}
.wp{flex:none;padding:3px 8px;background:#1a1250}.wcards{display:flex;gap:9px;justify-content:center;align-items:flex-end;padding-top:6px}.wp .card{--cw:36px;cursor:default}.wp .role,.wp .nm{display:none}.wp .art{margin-top:6px}.wnext{font-size:8px;font-weight:800;text-align:center;margin-left:8px;opacity:.7}.wnext .card{--cw:30px}
.welix{position:relative;height:13px;background:#2a0c40;border-radius:8px;overflow:hidden;margin-top:3px}.welix i{display:block;height:100%;background:linear-gradient(#ee6cff,#a21ad9)}.welix span{position:absolute;left:8px;top:0;font-size:10px;line-height:13px;font-weight:900}

#watchBar .btn.on{box-shadow:0 0 0 3px #fff}
#emoBtn{position:absolute;left:8px;bottom:8px;width:44px;height:44px;border-radius:50%;font-size:24px;padding:0}

.win{color:#ffd75e}.lose{color:#ff7b7b}.draw{color:#cfe}

.slotrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}

</style></head><body>
<div id="app">
 <div id="menu" class="screen">
  <div id="top"></div>
  <div id="content"></div>

<script>
// ==ENGINE START==
const W=360,H=600,RY=300,BR=[90,270],BW=24,RH=14;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.floor(Math.random()*a.length)];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const sc=l=>Math.pow(1.1,l-1);
// ---- Karten (Werte angelehnt an Clash Royale 2017, auf dieses Spiel skaliert)
const SPD={0:0,s:15,m:20,f:30,v:40}; // 1 Feld = 20 px; Langsam/Mittel/Schnell/Sehr schnell = 45/60/90/120
const RAR={c:{n:'Gewöhnlich',max:13},r:{n:'Selten',max:11},e:{n:'Episch',max:8},l:{n:'Legendär',max:5}};
const CARD_LIST=[],CARDS={};
function T(id,name,role,cost,rar,ar,hp,dmg,hs,spd,rng,desc,o={}){add(Object.assign({id,name,role,cost,rar,ar,type:'troop',hp,dmg,atk:hs,spd,rng,desc,count:1,rad:9},o));}
function Bd(id,name,role,cost,rar,ar,hp,dmg,hs,rng,life,desc,o={}){add(Object.assign({id,name,role,cost,rar,ar,type:'building',hp,dmg,atk:hs,spd:0,rng,life,desc,count:1,rad:13},o));}
function Sp(id,name,cost,rar,ar,dmg,r,desc,o={}){add(Object.assign({id,name,role:'ZAUBER',cost,rar,ar,type:'spell',dmg,r,desc},o));}
function add(c){
 const K=.6;c.hp=Math.round((c.hp||0)*K);c.dmg=Math.round((c.dmg||0)*K);
 if(c.shield)c.shield=Math.round(c.shield*K);if(c.heal)c.heal=Math.round(c.heal*K);if(c.death)c.death=[Math.round(c.death[0]*K),c.death[1]*20];if(c.land)c.land=[Math.round(c.land[0]*K),c.land[1]*20,c.land[2]||0];
 if(c.type==='spell')c.radius=c.r*20;else{c.spd=SPD[c.spd];c.range=Math.max(8,c.rng*20);if(c.rng>=2)c.proj=c.proj||'arrow';c.splash=(c.splash||0)*20;c.minR=(c.minR||0)*20;c.dps=c.atk?c.dmg/c.atk:0;}
 CARD_LIST.push(c);CARDS[c.id]=c;
}
// Arena 0 – Start
T('squire','Jungritter','NAH',3,'c',0,1452,167,1.2,'m',.7,'Solider Schwertkämpfer gegen Bodenziele.',{starter:1});
T('archer','Bogen-Duo','FERN',3,'c',0,252,86,1.2,'m',5,'Zwei Schützinnen, treffen Boden und Luft.',{count:2,rad:7,hitsAir:1,starter:1});
T('moth','Flatterbiester','LUFT',3,'c',0,190,84,1,'f',1,'Drei Flieger, greifen Boden und Luft an.',{count:3,rad:6,fly:1,hitsAir:1,starter:1});
T('titan','Steinhüne','TANK',5,'r',0,3275,211,1.5,'s',.8,'Greift nur Gebäude an und hält enorm viel aus.',{rad:15,bOnly:1,starter:1});
T('minik','Blech-Knirps','NAH',4,'r',0,1129,598,1.8,'f',.7,'Wenige, aber gewaltige Schläge.',{starter:1});
T('musk','Musketenmaid','FERN',4,'r',0,598,181,1.1,'m',6,'Weitschüsse auf Boden und Luft.',{hitsAir:1,proj:'ball',starter:1});
Sp('volley','Pfeilhagel',3,'c',0,243,4,'Großer Kreis, ideal gegen Schwärme.',{starter:1});
Sp('fireball','Feuerkugel',4,'r',0,572,2.5,'Viel Schaden in einem mittleren Kreis.',{starter:1});
// Arena 1
T('goblins','Gobbo-Bande','SCHWARM',2,'c',1,167,99,1.1,'v',.5,'Drei sehr schnelle Dolchkämpfer.',{count:3,rad:6});
T('speargob','Speer-Gobbos','FERN',2,'c',1,110,67,1.3,'v',5,'Drei flinke Speerwerfer, auch gegen Luft.',{count:3,rad:6,hitsAir:1});
Bd('gobhut','Gobbo-Hütte','SPAWNER',5,'r',1,1060,0,0,0,40,'Schickt regelmäßig Speer-Gobbos los.',{spawner:['speargob',1,4.9]});
T('bomber','Bombenknochen','FLÄCHE',3,'c',1,310,225,1.9,'m',4.5,'Wirft Bomben auf Bodentruppen.',{splash:1.5,proj:'bomb'});
// Arena 2
T('bones','Klapperhaufen','SCHWARM',1,'c',2,67,67,1,'f',.5,'Drei billige Skelette zum Ablenken.',{count:3,rad:5});

function newAccount(){const cards={};PLAY_CARDS.forEach(c=>cards[c.id]={lvl:1,copies:0,own:!!c.starter});return{trophies:0,best:0,gold:0,xp:0,lvl:1,wins:0,losses:0,draws:0,form:[],cards,deck:START_DECK.slice(),chests:[null,null,null,null]};}
const need=(id,l)=>NEED[CARDS[id].rar][l-1],goldNeed=(id,l)=>Math.round(GOLD[l-1]*GMULT[CARDS[id].rar]);
function canUp(a,id){const d=a.cards[id];return d.own&&d.lvl<RAR[CARDS[id].rar].max&&d.copies>=need(id,d.lvl)&&a.gold>=goldNeed(id,d.lvl);}

  let r=Math.random()*w.reduce((x,y)=>x+y,0),k=0;while(k<p.length-1&&r>w[k]){r-=w[k];k++;}
  const c=p[k],base={c:[3,7],r:[1,3],e:[1,1],l:[1,1]}[c.rar];out[c.id]=Math.max(1,Math.round((base[0]+Math.random()*(base[1]-base[0]))*(c.rar==='l'?1:C.m)));}

const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};

 if(!ch)return'<div class="chest empty">leer</div>';const now=Date.now(),C=CHESTS[ch.type];let st;

 if(f.t==='spell'){const c=f.c;
  if(c.kind==='log'&&f.age>=f.delay){ctx.fillStyle='#8a5a2a';rr(x-c.radius,y-9,c.radius*2,18,8);ctx.fill();ctx.strokeStyle='#1b1230';ctx.lineWidth=2;ctx.stroke();return;}
  if(c.kind&&c.kind!=='barrel'&&c.kind!=='clone'&&f.age>=f.delay){const col={poison:'150,200,40',rage:'220,60,220',heal:'255,225,90',grave:'80,110,100',tornado:'180,215,255'}[c.kind];ctx.fillStyle=`rgba(${col},.28)`;ctx.strokeStyle=`rgba(${col},.9)`;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,c.radius,0,7);ctx.fill();ctx.stroke();if(c.kind==='tornado'){ctx.globalAlpha=.7;fig('tornado',x,y,c.radius);ctx.globalAlpha=1;}return;}
  if(f.age<f.delay){const k=f.age/f.delay;ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.beginPath();ctx.arc(x,y,c.radius,0,7);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(255,255,255,.1)';ctx.fill();
   if(c.id==='fireball'||c.id==='rocket'||c.id==='barrel'){fig(c.id,x,y-(1-k)*190,36);}else if(c.id==='volley'){for(let i=0;i<7;i++){const ax=x+Math.sin(i*2.1)*c.radius*.7,ay=y+Math.cos(i*1.7)*c.radius*.6-(1-k)*120+i*4;ctx.strokeStyle='#eee';ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax+2,ay-8);ctx.stroke();}}}
  else{const k=(f.age-f.delay)/f.dur,a=1-k;
   if(c.id==='bolt'&&f.hits){ctx.strokeStyle=`rgba(255,240,120,${a})`;ctx.lineWidth=3;for(const h of f.hits){const[hx,hy]=V(h.x,h.y);ctx.beginPath();let px=hx+rnd(-10,10),py=hy-120;ctx.moveTo(px,py);for(let i=1;i<=6;i++){px=hx+rnd(-9,9)*(1-i/7);py=hy-120+i*20;ctx.lineTo(px,py);}ctx.stroke();ctx.fillStyle=`rgba(255,255,160,${a*.6})`;ctx.beginPath();ctx.arc(hx,hy,24*k+8,0,7);ctx.fill();}}
   else{ctx.fillStyle=c.id==='frost'?`rgba(140,220,255,${a*.5})`:c.id==='fireball'||c.id==='rocket'?`rgba(255,120,30,${a*.55})`:c.id==='zap'?`rgba(120,220,255,${a*.6})`:`rgba(255,255,255,${a*.35})`;ctx.beginPath();ctx.arc(x,y,c.radius*(.6+.4*k),0,7);ctx.fill();ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=3;ctx.stroke();if(c.id==='frost'){for(let i=0;i<5;i++)emoji('❄️',x+Math.cos(i*1.3)*c.radius*.6,y+Math.sin(i*1.3)*c.radius*.6-k*10,12);}}}
 }else if(f.t==='ring'){const k=f.age/f.dur;ctx.strokeStyle=f.col;ctx.globalAlpha=1-k;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,f.r*(.4+.6*k),0,7);ctx.stroke();ctx.globalAlpha=1;}
 else if(f.t==='poof'){const k=f.age/f.dur;ctx.fillStyle=`rgba(230,230,230,${(1-k)*.8})`;for(let i=0;i<5;i++){const a=i*1.26;ctx.beginPath();ctx.arc(x+Math.cos(a)*f.r*k*1.4,y+Math.sin(a)*f.r*k*1.1,f.r*.35*(1-k*.4),0,7);ctx.fill();}}
 else if(f.t==='boom'){const k=f.age/f.dur;for(let i=0;i<10;i++){const a=i*.63,d=f.r*k*1.2;ctx.fillStyle=`rgba(${i%2?255:90},${i%2?150:90},${i%2?40:90},${1-k})`;ctx.beginPath();ctx.arc(x+Math.cos(a)*d,y+Math.sin(a)*d*.8,10*(1-k)+3,0,7);ctx.fill();}ctx.fillStyle=`rgba(255,220,120,${(1-k)*.7})`;ctx.beginPath();ctx.arc(x,y,f.r*k,0,7);ctx.fill();}
 else if(f.t==='num'){const k=f.age/f.dur;ctx.globalAlpha=1-k*k;ctx.font='bold '+(f.tw?13:11)+'px sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.fillStyle=f.team===0?'#ffb4b4':'#fff3a0';const yy=y-k*22;ctx.strokeText(f.v,x,yy);ctx.fillText(f.v,x,yy);ctx.globalAlpha=1;}
}
function drawBattle(m){
 const c=cv.width/W;ctx.setTransform(c,0,0,c,0,0);ctx.fillStyle=view.theme.g1;ctx.fillRect(0,0,W,VH);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(0,0,W,VH);ctx.setTransform(c,0,0,c,0,TOP*c);
 drawArena(view.theme,m.t);
 if(mode==='battle'&&view.sel>=0){const card=CARDS[m.hand[0][view.sel]];if(card&&(card.type!=='spell'||card.own)){for(let i=0;i<12;i++)for(let j=0;j<20;j++){const x=i*30+15,y=j*30+15;if(m.validAt(0,card,x,y)){ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(i*30,j*30,30,30);}else if(y<RY){ctx.fillStyle='rgba(255,40,40,.14)';ctx.fillRect(i*30,j*30,30,30);}}}}
 const items=[];for(const t of m.towers)items.push({y:V(t.x,t.y)[1],f:()=>drawTower(t,m)});
 for(const u of m.units)if(!u.fly)items.push({y:V(u.x,u.y)[1],f:()=>drawUnit(u,m)});
 items.sort((a,b)=>a.y-b.y);items.forEach(i=>i.f());
 for(const u of m.units)if(u.fly)drawUnit(u,m);
 for(const p of m.projs)drawProj(p);
 for(const f of m.fx)drawFx(f);
 drawLabels(m);
 if(mode==='battle'&&view.sel>=0&&view.hover){const card=CARDS[m.hand[0][view.sel]];if(card){const[hx,hy]=view.hover;
  if(card.type==='spell'){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.arc(hx,hy,card.radius,0,7);ctx.fill();ctx.stroke();ctx.globalAlpha=.8;fig(card.id,hx,hy,32);ctx.globalAlpha=1;}
  else{const ok=m.validAt(0,card,hx,hy);ctx.globalAlpha=ok?.75:.4;if(!ok){ctx.fillStyle='rgba(255,0,0,.35)';ctx.beginPath();ctx.arc(hx,hy,16,0,7);ctx.fill();}fig(card.id,hx,hy,figScale(card.rad)*40);if(card.range>40){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(hx,hy,card.range+card.rad,0,7);ctx.stroke();ctx.setLineDash([]);}ctx.globalAlpha=1;}}}
 if(m.emote){const k=m.tw[m.emote.team][2],[x,y]=V(k.x,k.y),yy=y-(m.emote.team===(view.flip?1:0)?68:-4);ctx.fillStyle='#fff';rr(x-22,yy-28,44,34,12);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.stroke();emoji(m.emote.e,x,yy-11,24);}
}
// HUD
function crownsHTML(n){return[0,1,2].map(i=>`<span class="${i<n?'on':'of'}">♛</span>`).join('');}
let lastHand='',lastBan=0;
function hud(m,watch){
 const top=watch&&view.flip?0:1,bot=1-top;
 $('#oppAv').textContent=m.p[top].av||'👤';$('#oppName').textContent=m.p[top].name+' 🏆'+(m.p[top].trophies|0);$('#oppCrowns').innerHTML=crownsHTML(m.crowns[bot]);
 $('#meAv').textContent=m.p[bot].av||'👤';$('#meName').textContent=m.p[bot].name+' 🏆'+(m.p[bot].trophies|0);$('#meCrowns').innerHTML=crownsHTML(m.crowns[top]);
 if(watch){watchPanel($('#wTop'),m,top);watchPanel($('#wBot'),m,bot);}
 const tm=$('#timer');tm.textContent=m.ot?'⚡ '+fmt(240-m.t):fmt(180-m.t);tm.classList.toggle('dbl',m.t>=120);
 if(!watch){const el=m.el[0];$('#elixFill').style.width=el/10*100+'%';$('#elixNum').textContent=Math.floor(el);
  const h=m.hand[0].join(',')+'|'+m.hand[0].map(id=>CARDS[id].cost<=el?1:0).join('')+'|'+view.sel+'|'+m.queue[0][0];
  if(h!==lastHand){lastHand=h;$('#cards').innerHTML=m.hand[0].map((id,i)=>cardHTML(id,S.cards[id].lvl,(CARDS[id].cost>el?'no ':'')+(view.sel===i?'sel':'')).replace('class="card','data-i="'+i+'" class="card')).join('');$('#nextCard').innerHTML='Nächste'+cardHTML(m.queue[0][0],0);}}
 if(!watch){const c=view.sel>=0&&CARDS[m.hand[0][view.sel]];setHTML($('#info'),c?`<span><b>${c.name} · ${c.role}</b><br>${c.desc}</span>`:'<span>Tippe eine Karte an, um zu sehen, was sie tut.</span>','info');}
 $('#lblBtn').classList.toggle('off',S.labels===false);
 const b=$('#banner');if(m.t>=120&&m.t<122&&lastBan!==1){lastBan=1;b.textContent='DOPPELTES ELIXIER!';b.classList.remove('on');void b.offsetWidth;b.classList.add('on');}
 if(m.ot&&m.t<182&&lastBan!==2){lastBan=2;b.textContent='VERLÄNGERUNG!';b.classList.remove('on');void b.offsetWidth;b.classList.add('on');}
}
function watchPanel(el,m,k){
 const key=el.id;if(!el.firstChild||el.dataset.team!==String(k)+':'+m.id){el.dataset.team=k+':'+m.id;el.innerHTML='<div class="wcards"></div><div class="welix"><i></i><span></span></div>';lastHTML[key]='';}
 setHTML(el.firstChild,m.hand[k].map(id=>cardHTML(id,m.p[k].lvl(id))).join('')+'<div class="wnext">Nächste'+cardHTML(m.queue[k][0],m.p[k].lvl(m.queue[k][0]))+'</div>',key);
 el.querySelector('.welix i').style.width=m.el[k]*10+'%';el.querySelector('.welix span').textContent='💧 '+Math.floor(m.el[k]);
}
function evSound(m){for(const e of m.ev){if(e==='play0')SND.play0();else if(e==='tower')SND.tower();}m.ev.length=0;}

// ---- Kampf (Spieler)
function playerProfile(){return{name:S.name,av:'👑',trophies:S.trophies,deck:S.deck.slice(),kingLvl:S.lvl,lvl:id=>S.cards[id].lvl,brain:null};}
function showScreen(s){$('#menu').classList.toggle('hidden',s!=='menu');$('#battle').classList.toggle('hidden',s!=='battle');}
let searching=null;
function startBattle(){
 if(searching)return;const v=$('#vs'),t0=performance.now(),dur=rnd(5000,10000);v.classList.remove('hidden');
 v.innerHTML=`<div style="font-size:60px">🔍</div><div style="font-size:22px;font-weight:900">Suche Gegner …</div><div class="stat" style="font-size:16px">🏆 ${S.trophies} · <span id="searchT">0</span> s</div><button class="btn red" data-act="cancelSearch">Abbrechen</button>`;
 const tick=setInterval(()=>{const e=$('#searchT');if(e)e.textContent=Math.floor((performance.now()-t0)/1000);},250);
 searching={tick,to:setTimeout(found,dur)};
}
function stopSearch(){if(!searching)return;clearInterval(searching.tick);clearTimeout(searching.to);searching=null;}
function found(){
 const opp=world.pickOpponent(S.trophies),v=$('#vs');if(!opp){searching.to=setTimeout(found,1000);return;}
 stopSearch();searching={};popp=opp;opp.search=null;
 v.innerHTML=`<div class="stat" style="font-size:16px">Gegner gefunden!</div><div class="pl"><div class="p">👑<small>${S.name}</small><small>🏆 ${S.trophies} · Lv ${S.lvl}</small></div><div class="vsx">VS</div><div class="p">${opp.av}<small>${opp.name}</small><small>🏆 ${opp.trophies} · Lv ${opp.lvl}</small></div></div>`;
 sfx(300,.4,'sawtooth',.05,300);
 setTimeout(()=>{searching=null;v.classList.add('hidden');beginMatch(opp);},2200);
}
function beginMatch(opp){
 pm=new Match(playerProfile(),world.profile(opp));pm.onEnd=()=>{pm.endAt=performance.now();};
 mode='battle';started=true;pacc=0;lastHand='';lastBan=0;view.sel=-1;view.hover=null;view.flip=false;view.theme=arenaFor(Math.max(S.trophies,opp.trophies));
 $('#wTop').classList.add('hidden');$('#wBot').classList.add('hidden');
 showScreen('battle');$('#bar').classList.remove('hidden');$('#watchBar').classList.add('hidden');$('#emoBtn').classList.remove('hidden');fit();
 $('#emoPick').innerHTML=['😀','😎','😂','😭','😡','👍'].map(e=>`<span data-act="emo" data-e="${e}">${e}</span>`).join('');$('#emoPick').classList.add('hidden');
 const b=$('#banner');b.textContent='LOS!';b.classList.remove('on');void b.offsetWidth;b.classList.add('on');
}
function showResult(m){
 const w=m.winner,opp=popp,before=arenaFor(S.best).i,r=settle(S,opp,w),cr=m.crowns;
 const rw=matchReward(S,w<0?0:w===0?1:-1,cr[0]),{gold,xp,chest}=rw;matchReward(opp,w<0?0:w===1?1:-1,cr[1]);opp.inMatch=false;opp.idle=rnd(6,16);opp.wait=0;save();
 const na=arenaFor(S.best).i;if(na>before)setTimeout(()=>toast('🎉 Neue Arena: '+ARENAS[na].n),400);else if(rw.up)setTimeout(()=>toast('🎉 Level '+S.lvl+'!'),400);
 (w===0?SND.win:SND.lose)();
 $('#result').innerHTML=`<div class="mbox"><h1 class="${w===0?'win':w===1?'lose':'draw'}">${w===0?'SIEG!':w===1?'NIEDERLAGE':'UNENTSCHIEDEN'}</h1>
 <div style="font-size:34px;margin:6px 0" class="crowns"><span style="color:#8cf">${crownsHTML(cr[1]).replace(/class="on"/g,'class="on"')}</span> &nbsp;:&nbsp; <span style="color:#f99">${crownsHTML(cr[0])}</span></div>
 <div style="font-size:13px;opacity:.9">${S.name} ${cr[0]} : ${cr[1]} ${opp.name}</div>
 <table style="margin:12px 0"><tr><td>Trophäen</td><td>${r.da>=0?'+':''}${r.da} 🏆</td></tr><tr><td>Gold</td><td>+${gold} 🪙</td></tr><tr><td>Erfahrung</td><td>+${xp} XP</td></tr>${chest?`<tr><td>Truhe</td><td>${CHESTS[chest.type].i} ${CHESTS[chest.type].n}</td></tr>`:''}</table>
 <button class="btn green big" style="width:100%;font-size:20px" data-act="resClose">Weiter</button></div>`;
 $('#result').classList.remove('hidden');
}
function leaveBattle(){mode='menu';pm=null;popp=null;showScreen('menu');lastHTML.tab='';renderTab();}
// Zuschauen
function startWatch(m){wm=m;m.watch=true;m.speed=1;mode='watch';view.flip=false;view.sel=-1;view.theme=arenaFor(Math.max(m.A.trophies,m.B.trophies));lastBan=0;$('#wTop').classList.remove('hidden');$('#wBot').classList.remove('hidden');showScreen('battle');$('#bar').classList.add('hidden');$('#watchBar').classList.remove('hidden');$('#emoBtn').classList.add('hidden');$('#emoPick').classList.add('hidden');fit();updWatchBtns();}
function updWatchBtns(){document.querySelectorAll('#watchBar .sp').forEach(b=>b.classList.toggle('on',wm&&+b.dataset.s===wm.speed));}
function endWatch(){if(wm){wm.watch=false;wm.speed=world.speed;}wm=null;mode='menu';showScreen('menu');lastHTML.tab='';renderTab();}

// Eingabe
function cvPos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*VH-TOP,e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom];}
let drag=null;
$('#cards').addEventListener('pointerdown',e=>{const el=e.target.closest('[data-i]');if(!el||!pm||pm.over)return;e.preventDefault();const i=+el.dataset.i;drag={i,moved:false,sx:e.clientX,sy:e.clientY,was:view.sel===i};view.sel=i;lastHand='';});
window.addEventListener('pointermove',e=>{if(mode!=='battle')return;const[x,y,inn]=cvPos(e);view.hover=inn?[x,y]:view.hover;if(drag&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8)drag.moved=true;});
window.addEventListener('pointerup',e=>{
 if(mode!=='battle'||!pm){drag=null;return;}
 const[x,y,inn]=cvPos(e);const d=drag;drag=null;
 if(d&&!d.moved){if(d.was){view.sel=-1;lastHand='';}return;}
 if(inn&&view.sel>=0&&!pm.over){
  if(pm.play(0,view.sel,x,y)){view.sel=-1;lastHand='';}else{const c=CARDS[pm.hand[0][view.sel]];SND.bad();if(c&&pm.el[0]<c.cost)toast('Nicht genug Elixir');else if(c)toast('Hier kannst du nicht platzieren');}
 }
});
document.addEventListener('keydown',e=>{if(mode==='battle'&&pm&&e.key>='1'&&e.key<='4'){view.sel=+e.key-1;lastHand='';}});

// Hauptschleife
let last=performance.now(),mt=0;
function frame(now){
 const dt=Math.min(.1,(now-last)/1000);last=now;world.update(dt);
 if(mode==='battle'&&pm){
  if(!pm.over){pacc+=dt;let n=0;while(pacc>=1/30&&n<6){pm.step(1/30);pacc-=1/30;n++;}}
  evSound(pm);drawBattle(pm);hud(pm,false);
  if(pm.over&&!pm.shown&&performance.now()-pm.endAt>1600){pm.shown=true;showResult(pm);}
 }else if(mode==='watch'&&wm){
  drawBattle(wm);hud(wm,true);
  if(wm.over&&!wm.msg){wm.msg=1;const b=$('#banner');b.textContent=wm.winner<0?'REMIS':(wm.winner===0?wm.A.name:wm.B.name)+' gewinnt!';b.classList.remove('on');void b.offsetWidth;b.classList.add('on');}
 }else{mt+=dt;if(mt>=1){mt=0;if(!$('#modal').classList.contains('hidden')&&tab!=='live'){}else if($('#modal').classList.contains('hidden'))renderTab();}}
 requestAnimationFrame(frame);
}
renderTab();requestAnimationFrame(frame);
</script></body></html>
